name: cmdb-alert-correlation
description: >
  Every 5 minutes: finds un-acknowledged Kibana alerts raised on CMDB CIs (rules tagged cmdb-ci-correlation),
  walks the ServiceNow CMDB topology in servicenow-cmdb-ci-rel-lookup (up to 5 hops upstream = towards parents and
  5 hops downstream = towards children) and correlates them. An alert whose topology neighbourhood contains a CI that
  already has an alert on an OPEN case is attached to that case (case title + description are re-generated by AI);
  otherwise a new case is created (title + description generated by AI). Processed alerts are acknowledged.
enabled: true
tags: ["cmdb", "alert-correlation", "topology", "cases"]

consts:
  case_owner: observability
  # Only alerts from rules carrying this tag are considered (see scripts/02_create_rules.sh).
  # The CI name is read from kibana.alert.instance.id (rules group by cmdb.ci.name).
  rule_tag: cmdb-ci-correlation
  alerts_index: ".alerts-*"
  alert_lookback: "now-24h"
  lookup_index: servicenow-cmdb-ci-rel-lookup
  # Placeholder CIs that exist in the CMDB as a child of many unrelated CIs; never traverse through them.
  ignore_cis:
    - "Decommissioned"
  # Hop limits. NOTE: the same numbers appear in the `while` conditions below (KQL cannot read consts) -
  # keep them in sync if you change them.
  max_hops_up: 5
  max_hops_down: 5

triggers:
  - type: scheduled
    with:
      every: 5m
  - type: manual

settings:
  timeout: 15m
  # One run at a time: two overlapping runs could both decide "no open case yet" and create duplicate cases.
  concurrency:
    key: "cmdb-alert-correlation"
    strategy: queue
    max: 1
    queue-size: 3
    queue-ttl: 10m

steps:
  # ---------------------------------------------------------------------------------------------
  # 1. Which CIs currently have un-acknowledged alerts? (oldest alert first so cases form in time order)
  # ---------------------------------------------------------------------------------------------
  - name: find_cis_with_open_alerts
    type: elasticsearch.request
    with:
      method: POST
      path: "/{{ consts.alerts_index }}/_search"
      body:
        size: 0
        track_total_hits: true
        query:
          bool:
            filter:
              - term:
                  kibana.alert.rule.tags: "{{ consts.rule_tag }}"
              - term:
                  kibana.alert.workflow_status: "open"
              - range:
                  "@timestamp":
                    gte: "{{ consts.alert_lookback }}"
        aggs:
          cis:
            terms:
              field: kibana.alert.instance.id
              size: 100
              order:
                first_seen: asc
            aggs:
              first_seen:
                min:
                  field: kibana.alert.start

  - name: log_scan
    type: console
    with:
      message: "{{ steps.find_cis_with_open_alerts.output.hits.total.value }} un-acknowledged CMDB alert(s) on {{ steps.find_cis_with_open_alerts.output.aggregations.cis.buckets | size }} CI(s): {{ steps.find_cis_with_open_alerts.output.aggregations.cis.buckets | map: 'key' | join: ', ' }}"

  # ---------------------------------------------------------------------------------------------
  # 2. Process one CI at a time (sequential on purpose: the case created for the first CI is visible
  #    to the next CI, so alerts that arrive in the same run correlate exactly like alerts from later runs).
  # ---------------------------------------------------------------------------------------------
  - name: process_each_ci
    type: foreach
    foreach: "${{ steps.find_cis_with_open_alerts.output.aggregations.cis.buckets }}"
    max-iterations:
      limit: 100
      on-limit: fail
    steps:
      - name: init_walk
        type: data.set
        with:
          ci: "{{ foreach.item.key }}"
          up_frontier: ["{{ foreach.item.key }}"]
          up_visited: ["{{ foreach.item.key }}"]
          up_layers: []
          up_n: 1
          up_hops: 0
          down_frontier: ["{{ foreach.item.key }}"]
          down_visited: ["{{ foreach.item.key }}"]
          down_layers: []
          down_n: 1
          down_hops: 0
          has_case: 0
          target_case_id: ""
          target_case_title: ""
          target_case_description: ""
          other_open_case_ids: []
          matched_cis: []
          target_case_severity: "medium"
          ai_severity_raw: ""
          ai_desc_len: 0
          ai_title_len: 0

      # ---- 2a. Upstream walk: follow edges child -> parent, one hop per iteration, max 5 hops -------------
      - name: walk_upstream
        type: while
        condition: "variables.up_n > 0 and variables.up_hops < 5"
        max-iterations: 5
        steps:
          - name: hop_up
            type: elasticsearch.request
            with:
              method: POST
              path: "/{{ consts.lookup_index }}/_search"
              body:
                size: 0
                query:
                  bool:
                    filter:
                      - terms:
                          child.value: "${{ variables.up_frontier }}"
                    must_not:
                      # already visited (cycle protection) or a placeholder CI
                      - terms:
                          parent.value: "${{ variables.up_visited | concat: consts.ignore_cis }}"
                aggs:
                  next:
                    terms:
                      field: parent.value
                      size: 1000
          - name: advance_up
            type: data.set
            with:
              up_frontier: "${{ steps.hop_up.output.aggregations.next.buckets | map: 'key' }}"
              up_visited: "${{ variables.up_visited | concat: (steps.hop_up.output.aggregations.next.buckets | map: 'key') }}"
              up_layers: "${{ variables.up_layers | push: (steps.hop_up.output.aggregations.next.buckets | map: 'key') }}"
              up_n: "${{ steps.hop_up.output.aggregations.next.buckets | size }}"
              up_hops: "${{ variables.up_hops | plus: 1 }}"

      # ---- 2b. Downstream walk: follow edges parent -> child, max 5 hops ------------------------------------
      - name: walk_downstream
        type: while
        condition: "variables.down_n > 0 and variables.down_hops < 5"
        max-iterations: 5
        steps:
          - name: hop_down
            type: elasticsearch.request
            with:
              method: POST
              path: "/{{ consts.lookup_index }}/_search"
              body:
                size: 0
                query:
                  bool:
                    filter:
                      - terms:
                          parent.value: "${{ variables.down_frontier }}"
                    must_not:
                      - terms:
                          child.value: "${{ variables.down_visited | concat: consts.ignore_cis }}"
                aggs:
                  next:
                    terms:
                      field: child.value
                      size: 1000
          - name: advance_down
            type: data.set
            with:
              down_frontier: "${{ steps.hop_down.output.aggregations.next.buckets | map: 'key' }}"
              down_visited: "${{ variables.down_visited | concat: (steps.hop_down.output.aggregations.next.buckets | map: 'key') }}"
              down_layers: "${{ variables.down_layers | push: (steps.hop_down.output.aggregations.next.buckets | map: 'key') }}"
              down_n: "${{ steps.hop_down.output.aggregations.next.buckets | size }}"
              down_hops: "${{ variables.down_hops | plus: 1 }}"

      - name: topology_neighbourhood
        type: data.set
        with:
          related_cis: "${{ variables.up_visited | concat: variables.down_visited | uniq }}"

      - name: log_neighbourhood
        type: console
        with:
          message: "CI '{{ variables.ci }}': {{ variables.up_visited | size | minus: 1 }} upstream CI(s) and {{ variables.down_visited | size | minus: 1 }} downstream CI(s) within 5 hops each way"

      # ---- 2c. The un-acknowledged alerts of this CI ----------------------------------------------------------
      - name: ci_alerts
        type: elasticsearch.request
        with:
          method: POST
          path: "/{{ consts.alerts_index }}/_search"
          body:
            size: 100
            sort:
              - kibana.alert.start: asc
            query:
              bool:
                filter:
                  - term:
                      kibana.alert.instance.id: "{{ variables.ci }}"
                  - term:
                      kibana.alert.rule.tags: "{{ consts.rule_tag }}"
                  - term:
                      kibana.alert.workflow_status: "open"
                  - range:
                      "@timestamp":
                        gte: "{{ consts.alert_lookback }}"

      - name: alert_refs
        type: data.map
        items: "${{ steps.ci_alerts.output.hits.hits }}"
        with:
          fields:
            alertId: "{{ item._id }}"
            index: "{{ item._index }}"
            rule:
              id: "{{ item._source['kibana.alert.rule.uuid'] }}"
              name: "{{ item._source['kibana.alert.rule.name'] }}"

      # ---- 2d. Is any CI in the neighbourhood already on an alert that sits in a case? -------------------------
      - name: find_candidate_cases
        type: elasticsearch.request
        with:
          method: POST
          path: "/{{ consts.alerts_index }}/_search"
          body:
            size: 0
            query:
              bool:
                filter:
                  - terms:
                      kibana.alert.instance.id: "${{ variables.related_cis }}"
                  - term:
                      kibana.alert.rule.tags: "{{ consts.rule_tag }}"
                  - exists:
                      field: kibana.alert.case_ids
            aggs:
              cases:
                terms:
                  field: kibana.alert.case_ids
                  size: 50
                aggs:
                  cis:
                    terms:
                      field: kibana.alert.instance.id
                      size: 25

      - name: candidate_summary
        type: data.set
        with:
          n_candidates: "${{ steps.find_candidate_cases.output.aggregations.cases.buckets | size }}"

      - name: resolve_open_case
        type: if
        condition: "variables.n_candidates > 0"
        steps:
          # The alert index also remembers closed cases -> keep only cases that are still open / in progress.
          - name: fetch_candidate_cases
            type: cases.getCases
            with:
              case_ids: "${{ steps.find_candidate_cases.output.aggregations.cases.buckets | map: 'key' }}"

          - name: still_open_cases
            type: data.filter
            items: "${{ steps.fetch_candidate_cases.output.cases }}"
            with:
              condition: 'item.status : "open" or item.status : "in-progress"'

          - name: pick_oldest_open_case
            type: data.set
            with:
              open_case_count: "${{ steps.still_open_cases.output | size }}"
              target_case_id: "{{ steps.still_open_cases.output | sort: 'created_at' | map: 'id' | first }}"
              target_case_title: "{{ steps.still_open_cases.output | sort: 'created_at' | map: 'title' | first }}"
              target_case_description: "{{ steps.still_open_cases.output | sort: 'created_at' | map: 'description' | first }}"
              target_case_severity: "{{ steps.still_open_cases.output | sort: 'created_at' | map: 'severity' | first }}"
              other_open_case_ids: "${{ steps.still_open_cases.output | sort: 'created_at' | map: 'id' | shift }}"
              has_case: "${{ steps.still_open_cases.output | size | at_least: 0 | at_most: 1 }}"

      # =========================================================================================================
      # 3A. Correlated with an existing OPEN case -> attach, re-generate title/description, acknowledge
      # =========================================================================================================
      - name: attach_to_existing_case
        type: if
        condition: "variables.has_case > 0"
        steps:
          - name: alerts_already_in_case
            type: elasticsearch.request
            with:
              method: POST
              path: "/{{ consts.alerts_index }}/_search"
              body:
                size: 100
                sort:
                  - kibana.alert.start: asc
                query:
                  term:
                    kibana.alert.case_ids: "{{ variables.target_case_id }}"

          - name: matched_cis
            type: data.set
            with:
              matched_cis: "${{ steps.find_candidate_cases.output.aggregations.cases.buckets | where: 'key', variables.target_case_id | map: 'cis' | first | map: 'buckets' | first | map: 'key' }}"

          # Human readable "why": for every CI that already has an alert in the case, its hop distance from this CI.
          - name: relation_evidence
            type: data.set
            with:
              relation_evidence: |
                {% for m in variables.matched_cis %}{% if m == variables.ci %}- {{ m }}: same CI
                {% endif %}{% for layer in variables.up_layers %}{% if layer contains m %}- {{ m }}: {{ forloop.index }} hop(s) upstream of {{ variables.ci }}
                {% endif %}{% endfor %}{% for layer in variables.down_layers %}{% if layer contains m %}- {{ m }}: {{ forloop.index }} hop(s) downstream of {{ variables.ci }}
                {% endif %}{% endfor %}{% endfor %}

          # Only alerts that are not in the case yet: a re-run after a partial failure stays idempotent.
          - name: unattached_alerts
            type: elasticsearch.request
            with:
              method: POST
              path: "/{{ consts.alerts_index }}/_search"
              body:
                size: 100
                sort:
                  - kibana.alert.start: asc
                query:
                  bool:
                    filter:
                      - ids:
                          values: "${{ steps.ci_alerts.output.hits.hits | map: '_id' }}"
                    must_not:
                      - term:
                          kibana.alert.case_ids: "{{ variables.target_case_id }}"

          - name: unattached_alert_refs
            type: data.map
            items: "${{ steps.unattached_alerts.output.hits.hits }}"
            with:
              fields:
                alertId: "{{ item._id }}"
                index: "{{ item._index }}"
                rule:
                  id: "{{ item._source['kibana.alert.rule.uuid'] }}"
                  name: "{{ item._source['kibana.alert.rule.name'] }}"

          - name: count_unattached
            type: data.set
            with:
              n_new: "${{ steps.unattached_alerts.output.hits.hits | size }}"

          - name: attach_new_alerts_to_case
            type: if
            condition: "variables.n_new > 0"
            steps:
              - name: attach_alerts
                type: cases.addAlerts
                with:
                  case_id: "{{ variables.target_case_id }}"
                  alerts: "${{ steps.unattached_alert_refs.output }}"

              - name: ai_update_case_text
                type: ai.prompt
                on-failure:
                  retry:
                    max-attempts: 2
                    delay: "3s"
                  continue: true
                with:
                  temperature: 0.2
                  systemPrompt: "You are a senior ITSM / SRE incident analyst. You write precise, factual incident case text for responders. Never invent facts that are not in the data."
                  prompt: |
                    An open incident case already exists. A NEW alert on a topologically related CI has just been correlated into it.
                    Produce an UPDATED case title and description that reflect the whole incident, including the new alert.

                    Topology semantics: the CMDB stores relationships as parent -> child where the parent RUNS ON / DEPENDS ON the child
                    (e.g. "Microsoft IIS Server@pmtwinxl01" -> "pmtwinxl01" -> "hvhost01": the web server runs on the VM, the VM is hosted on the hypervisor).
                    "Upstream" of a CI = its parents (the applications/services that depend on it, i.e. what is impacted).
                    "Downstream" of a CI = its children (the infrastructure it depends on, i.e. the likely root cause).
                    Faults normally propagate from downstream infrastructure up to upstream services.
                    Do not guess the technology or role of a CI from its name; only state what the data shows.

                    CURRENT CASE TITLE: {{ variables.target_case_title }}
                    CURRENT CASE DESCRIPTION:
                    {{ variables.target_case_description }}

                    NEW ALERT(S) ON CI "{{ variables.ci }}":
                    {% for hit in steps.unattached_alerts.output.hits.hits %}- rule: {{ hit._source['kibana.alert.rule.name'] }} | reason: {{ hit._source['kibana.alert.reason'] }} | started: {{ hit._source['kibana.alert.start'] }}
                    {% endfor %}
                    ALERTS ALREADY IN THE CASE:
                    {% for hit in steps.alerts_already_in_case.output.hits.hits %}- CI: {{ hit._source['kibana.alert.instance.id'] }} | rule: {{ hit._source['kibana.alert.rule.name'] }} | reason: {{ hit._source['kibana.alert.reason'] }} | started: {{ hit._source['kibana.alert.start'] }}
                    {% endfor %}
                    WHY THEY ARE RELATED (topology of CI "{{ variables.ci }}", from the CMDB relationship table):
                    {% for layer in variables.up_layers %}{% if layer.size > 0 %}- {{ forloop.index }} hop(s) upstream: {% for c in layer limit: 15 %}{% if c.size != 32 %}{{ c }}; {% endif %}{% endfor %}
                    {% endif %}{% endfor %}{% for layer in variables.down_layers %}{% if layer.size > 0 %}- {{ forloop.index }} hop(s) downstream: {% for c in layer limit: 15 %}{% if c.size != 32 %}{{ c }}; {% endif %}{% endfor %}
                    {% endif %}{% endfor %}CIs that already have alerts in the case and sit inside this topology:
                    {{ variables.relation_evidence | strip }}

                    Reply in EXACTLY this plain-text format and nothing else (no code fences, no preamble):
                    TITLE: <single line, max 120 characters, name the most upstream/root-cause CI and the user-visible impact if known>
                    SEVERITY: <one word: low, medium, high or critical, based on blast radius and symptoms>
                    DESCRIPTION:
                    <Markdown with the sections "Summary", "Impacted CIs & topology" (a short chain like A -> B -> C), "Alerts" (bullets) and "Suggested next steps">

              - name: parse_ai_update_text
                type: data.set
                with:
                  ai_text: "{{ steps.ai_update_case_text.output.content | default: '' | remove: '```' }}"

              - name: parse_ai_update
                type: data.set
                with:
                  ai_title: "{{ variables.ai_text | split: 'SEVERITY:' | first | remove: 'TITLE:' | strip | truncate: 160 }}"
                  ai_severity_raw: "{{ variables.ai_text | split: 'SEVERITY:' | last | split: 'DESCRIPTION:' | first | strip | downcase }}"
                  ai_description: "{{ variables.ai_text | split: 'DESCRIPTION:' | shift | join: 'DESCRIPTION:' | strip }}"

              - name: parse_ai_update_checks
                type: data.set
                with:
                  ai_desc_len: "${{ variables.ai_description | size }}"
                  ai_title_len: "${{ variables.ai_title | size }}"

              # Only touch the case text when the AI answered; otherwise keep what is there (the alerts are still attached).
              - name: update_case_text
                type: cases.updateCase
                if: "variables.ai_desc_len > 20 and variables.ai_title_len > 0"
                on-failure:
                  continue: true
                with:
                  case_id: "{{ variables.target_case_id }}"
                  updates:
                    title: "{{ variables.ai_title }}"
                    description: "{{ variables.ai_description }}"
                    severity: "{% if variables.ai_severity_raw == 'low' or variables.ai_severity_raw == 'medium' or variables.ai_severity_raw == 'high' or variables.ai_severity_raw == 'critical' %}{{ variables.ai_severity_raw }}{% else %}{{ variables.target_case_severity }}{% endif %}"

              - name: tag_case
                type: cases.addTags
                on-failure:
                  continue: true   # "tag already present" is reported as an error by the Cases API
                with:
                  case_id: "{{ variables.target_case_id }}"
                  tags: ["ci:{{ variables.ci }}"]

              - name: note_correlation
                type: cases.addComment
                with:
                  case_id: "{{ variables.target_case_id }}"
                  comment: |
                    **Alert correlated by workflow run `{{ execution.id }}`**

                    {{ steps.unattached_alerts.output.hits.hits | size }} new alert(s) on CI **{{ variables.ci }}** were attached because the CI is inside the topology neighbourhood (max 5 hops upstream / 5 hops downstream) of CI(s) that already have alerts in this case:

                    {{ variables.relation_evidence | strip }}
                    {%- if variables.other_open_case_ids.size > 0 %}

                    This CI is also topologically related to other open case(s): {{ variables.other_open_case_ids | join: ', ' }}.
                    {%- endif %}

              - name: log_attached
                type: console
                with:
                  message: "Attached {{ steps.unattached_alerts.output.hits.hits | size }} alert(s) on '{{ variables.ci }}' to existing case {{ variables.target_case_id }}"

        # =======================================================================================================
        # 3B. No related open case -> create one (AI generated title/description), attach, acknowledge
        # =======================================================================================================
        else:
          - name: ai_new_case_text
            type: ai.prompt
            on-failure:
              retry:
                max-attempts: 2
                delay: "3s"
              continue: true
            with:
              temperature: 0.2
              systemPrompt: "You are a senior ITSM / SRE incident analyst. You write precise, factual incident case text for responders. Never invent facts that are not in the data."
              prompt: |
                Create the title and description for a NEW incident case from the alerts below.

                Topology semantics: the CMDB stores relationships as parent -> child where the parent RUNS ON / DEPENDS ON the child
                (e.g. "Microsoft IIS Server@pmtwinxl01" -> "pmtwinxl01" -> "hvhost01": the web server runs on the VM, the VM is hosted on the hypervisor).
                "Upstream" of a CI = its parents (the applications/services that depend on it, i.e. what is impacted).
                "Downstream" of a CI = its children (the infrastructure it depends on, i.e. the likely root cause).
                Faults normally propagate from downstream infrastructure up to upstream services.
                Do not guess the technology or role of a CI from its name; only state what the data shows.

                ALERTS ON CI "{{ variables.ci }}":
                {% for hit in steps.ci_alerts.output.hits.hits %}- rule: {{ hit._source['kibana.alert.rule.name'] }} | reason: {{ hit._source['kibana.alert.reason'] }} | started: {{ hit._source['kibana.alert.start'] }}
                {% endfor %}
                TOPOLOGY OF CI "{{ variables.ci }}" (CMDB relationship table, max 5 hops each way):
                {% for layer in variables.up_layers %}{% if layer.size > 0 %}- {{ forloop.index }} hop(s) upstream: {% for c in layer limit: 15 %}{% if c.size != 32 %}{{ c }}; {% endif %}{% endfor %}
                {% endif %}{% endfor %}{% for layer in variables.down_layers %}{% if layer.size > 0 %}- {{ forloop.index }} hop(s) downstream: {% for c in layer limit: 15 %}{% if c.size != 32 %}{{ c }}; {% endif %}{% endfor %}
                {% endif %}{% endfor %}
                Reply in EXACTLY this plain-text format and nothing else (no code fences, no preamble):
                TITLE: <single line, max 120 characters, name the CI and the symptom>
                SEVERITY: <one word: low, medium, high or critical, based on blast radius and symptoms>
                DESCRIPTION:
                <Markdown with the sections "Summary", "Impacted CIs & topology" (a short chain like A -> B -> C), "Alerts" (bullets) and "Suggested next steps">

          - name: parse_ai_new_text
            type: data.set
            with:
              ai_text: "{{ steps.ai_new_case_text.output.content | default: '' | remove: '```' }}"

          - name: parse_ai_new
            type: data.set
            with:
              ai_title: "{{ variables.ai_text | split: 'SEVERITY:' | first | remove: 'TITLE:' | strip | truncate: 160 }}"
              ai_severity_raw: "{{ variables.ai_text | split: 'SEVERITY:' | last | split: 'DESCRIPTION:' | first | strip | downcase }}"
              ai_description: "{{ variables.ai_text | split: 'DESCRIPTION:' | shift | join: 'DESCRIPTION:' | strip }}"

          - name: parse_ai_new_checks
            type: data.set
            with:
              ai_desc_len: "${{ variables.ai_description | size }}"
              ai_title_len: "${{ variables.ai_title | size }}"

          - name: create_case
            type: cases.createCase
            with:
              # No LLM connector configured (or the call failed): fall back to the alerts' own text. The title is the rule
              # name of the oldest alert of this CI (alerts are sorted by kibana.alert.start asc); the description lists
              # every alert's rule name + reason.
              title: "{% if variables.ai_title_len > 0 and variables.ai_desc_len > 20 %}{{ variables.ai_title }}{% else %}{% for hit in steps.ci_alerts.output.hits.hits %}{% if forloop.first %}{{ hit._source['kibana.alert.rule.name'] | truncate: 160 }}{% endif %}{% endfor %}{% endif %}"
              description: "{% if variables.ai_desc_len > 20 %}{{ variables.ai_description }}{% else %}Auto-created from CMDB topology alert correlation on CI **{{ variables.ci }}** (no AI-generated text available).\n\n{% for hit in steps.ci_alerts.output.hits.hits %}- **{{ hit._source['kibana.alert.rule.name'] }}**: {{ hit._source['kibana.alert.reason'] }} (started {{ hit._source['kibana.alert.start'] }})\n{% endfor %}{% endif %}"
              severity: "{% if variables.ai_severity_raw == 'low' or variables.ai_severity_raw == 'medium' or variables.ai_severity_raw == 'high' or variables.ai_severity_raw == 'critical' %}{{ variables.ai_severity_raw }}{% else %}medium{% endif %}"
              owner: "{{ consts.case_owner }}"
              tags: ["cmdb-correlation", "auto-created", "ci:{{ variables.ci }}"]
              settings:
                syncAlerts: false

          - name: attach_alerts_new
            type: cases.addAlerts
            with:
              case_id: "{{ steps.create_case.output.case.id }}"
              alerts: "${{ steps.alert_refs.output }}"

          - name: remember_new_case
            type: data.set
            with:
              target_case_id: "{{ steps.create_case.output.case.id }}"

          - name: log_created
            type: console
            with:
              message: "Created case {{ steps.create_case.output.case.id }} for CI '{{ variables.ci }}' with {{ steps.ci_alerts.output.hits.hits | size }} alert(s)"

      # ---- 4. Acknowledge exactly the alerts we just processed ------------------------------------------------
      - name: acknowledge_alerts
        type: elasticsearch.request
        on-failure:
          retry:
            max-attempts: 3
            delay: "2s"
        with:
          method: POST
          path: "/{{ consts.alerts_index }}/_update_by_query"
          params:
            conflicts: proceed
            refresh: true
          body:
            query:
              ids:
                values: "${{ steps.ci_alerts.output.hits.hits | map: '_id' }}"
            script:
              lang: painless
              source: "ctx._source['kibana.alert.workflow_status'] = 'acknowledged'"

      # Make sure the case linkage written by the Cases API is searchable before the next CI is evaluated.
      - name: refresh_alerts
        type: elasticsearch.request
        on-failure:
          continue: true
        with:
          method: POST
          path: "/{{ consts.alerts_index }}/_refresh"

  - name: log_complete
    type: console
    with:
      message: "CMDB alert correlation finished: processed {{ steps.find_cis_with_open_alerts.output.aggregations.cis.buckets | size }} CI(s)."
